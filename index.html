<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maguiet Server List</title>
  <meta name="description" content="Lista de niveles de Geometry Dash ordenados por dificultad, con puntos, ID y leaderboard.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <img class="logo" src="assets/mi_cara.jpg" alt="Rana naranja de ojo enorme, el icono de Maguiet" width="72" height="72">
    <div>
      <h1>Maguiet Server List</h1>
      <p class="tagline">Los niveles más duros, ordenados por puesto.</p>
    </div>
  </header>

  <main>
    <h2 class="visually-hidden">Lista de niveles</h2>
    <ol id="level-list" class="level-list"></ol>
  </main>

  <dialog id="level-dialog" class="level-dialog" aria-labelledby="dlg-name">
    <button class="close" id="dlg-close" type="button" aria-label="Cerrar">&times;</button>

    <div class="dlg-video" id="dlg-video"></div>

    <div class="dlg-title">
      <span class="dlg-rank" id="dlg-rank"></span>
      <h2 id="dlg-name"></h2>
    </div>

    <dl class="stats">
      <div class="stat">
        <dt>Puntos</dt>
        <dd id="dlg-points"></dd>
      </div>
      <div class="stat">
        <dt>Dificultad</dt>
        <dd><span class="badge" id="dlg-difficulty"></span></dd>
      </div>
      <div class="stat">
        <dt>Creador</dt>
        <dd id="dlg-creator"></dd>
      </div>
      <div class="stat">
        <dt>ID del nivel</dt>
        <dd>
          <span id="dlg-id"></span>
          <button class="copy" id="dlg-copy" type="button">Copiar ID</button>
        </dd>
      </div>
    </dl>

    <section class="leaderboard" aria-labelledby="lb-title">
      <h3 id="lb-title">Leaderboard</h3>
      <ol id="dlg-leaderboard"></ol>
      <p class="empty" id="dlg-empty">Todavía nadie ha completado este nivel. El primer récord será el de arriba.</p>
    </section>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
