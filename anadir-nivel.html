<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Añadir nivel · Maguiet Server List</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Añadir nivel</h1>
    <p class="tagline"><a class="back" href="index.html">Volver a la lista</a></p>
  </header>

  <main>
    <ol class="steps">
      <li><strong>Rellena</strong> los datos del nivel.</li>
      <li>Pulsa <strong>Copiar código</strong>.</li>
      <li>Abre <strong>niveles.js</strong> y pega el código dentro de la lista, antes del <strong>];</strong> final. El orden decide el puesto: el de arriba es el #1.</li>
      <li>Guarda y sube los cambios con <strong>GitHub Desktop</strong> (Commit y Push origin).</li>
    </ol>

    <div class="tool">
      <label>Nombre del nivel
        <input id="f-nombre" type="text" placeholder="Ultimate MortalTerra" autocomplete="off">
      </label>

      <label>Enlace del vídeo
        <input id="f-video" type="text" placeholder="https://youtu.be/..." autocomplete="off">
        <span class="hint">Vale cualquier enlace de YouTube.</span>
      </label>

      <div class="row">
        <label>ID del nivel
          <input id="f-id" type="text" inputmode="numeric" placeholder="140986997" autocomplete="off">
        </label>
        <label>Creador
          <input id="f-creador" type="text" placeholder="Maguiet" autocomplete="off">
        </label>
      </div>

      <div class="row">
        <label>Puntos
          <input id="f-puntos" type="number" min="0" placeholder="200">
        </label>
        <label>Dificultad
          <select id="f-dificultad">
            <option>Easy Demon</option>
            <option>Medium Demon</option>
            <option selected>Hard Demon</option>
            <option>Insane Demon</option>
            <option>Extreme Demon</option>
          </select>
        </label>
      </div>

      <label>Leaderboard (opcional)
        <textarea id="f-jugadores" rows="3" placeholder="Un jugador por línea. Puedes poner la fecha después de una coma:&#10;Maguiet, 15/11/2026"></textarea>
      </label>

      <pre id="salida" aria-live="polite"></pre>

      <button class="primary" id="copiar" type="button">Copiar código</button>
    </div>
  </main>

  <script src="anadir-nivel.js"></script>
</body>
</html>
