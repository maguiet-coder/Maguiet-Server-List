<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista · Maguiet Server List</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Maguiet Server List</h1>
    <p class="tagline">Los niveles más duros, ordenados por puesto.</p>
  </header>

  <main>
    <div class="herramientas">
      <input id="buscar" class="search" type="search" placeholder="Buscar por nombre, creador, ID o puesto (ej. #3 o 1-10)" aria-label="Buscar nivel">
      <button class="copy" id="ir-final" type="button">↓ Ir al final</button>
    </div>
    <ol id="level-list" class="level-list"></ol>
    <p id="list-empty" class="empty" hidden></p>
  </main>

  <dialog id="level-dialog" class="level-dialog" aria-labelledby="dlg-name">
    <button class="close" id="dlg-close" type="button" aria-label="Cerrar">&times;</button>
    <div class="dlg-video" id="dlg-video"></div>
    <div class="dlg-under">
      <span class="badge" id="dlg-difficulty"></span>
      <a class="yt-link" id="dlg-yt" href="#" target="_blank" rel="noopener">Ver el vídeo en YouTube</a>
    </div>
    <div class="dlg-title">
      <span class="dlg-rank" id="dlg-rank"></span>
      <h2 id="dlg-name"></h2>
    </div>
    <dl class="stats">
      <div class="stat"><dt>Puntos</dt><dd id="dlg-points"></dd></div>
      <div class="stat"><dt>Creador</dt><dd id="dlg-creator"></dd></div>
      <div class="stat"><dt>ID del nivel</dt><dd><span id="dlg-id"></span><button class="copy" id="dlg-copy" type="button">Copiar ID</button><a class="copy" id="dlg-gd" href="https://gdbrowser.com/" target="_blank" rel="noopener">Ver en GDBrowser</a></dd></div>
    </dl>
    <section class="leaderboard" aria-labelledby="lb-title">
      <h3 id="lb-title">Leaderboard del nivel</h3>
      <ol id="dlg-leaderboard"></ol>
      <p class="empty" id="dlg-empty">Todavía nadie ha completado este nivel.</p>
    </section>
  </dialog>

  <script src="niveles.js"></script>
  <script src="nav.js"></script>
  <script src="script.js"></script>
  <script src="particulas.js"></script>
</body>
</html>
